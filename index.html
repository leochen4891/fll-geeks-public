<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLL Team Homework</title>
<style>
  :root { --ink:#1a2330; --soft:#5b6a7d; --accent:#0a7d4f; --bg:#fbfaf7; --card:#ffffff; --line:#e4e1d8; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:17px/1.65 "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; }
  h1 { font-size: 1.9rem; line-height:1.25; border-bottom: 3px solid var(--accent); padding-bottom: 12px; }
  h2 { font-size: 1.35rem; margin-top: 2.4em; color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: .92em; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f0eee6; }
  img { max-width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-sizing: border-box; }
  li { margin: .35em 0; }
  strong { color: #0c3a26; }
  em { color: var(--soft); }
  a { color: var(--accent); }
  .nav { font-size: .9em; }
  .rule { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
          border-radius: 6px; padding: 12px 16px; margin: 1em 0; }
  .rule p { margin: .3em 0; }
  .note { background: #fff8e6; border: 1px solid #f0dca8; border-radius: 6px; padding: 12px 16px; }
  footer { margin-top: 64px; color: var(--soft); font-size: .85em; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main>
<h1>Weekly Homework</h1>
<p>Newest first.</p>
<ul>
  <li><a href="homework/2026-09-28/">Week of September 28, 2026</a> — understand every block, best practices, videos, picked mission, Robotics Friday Oct 2</li>
</ul>
<footer>FLL team homework. Source: <a href="https://github.com/leochen4891/fll-geeks-public">fll-geeks-public</a></footer>
</main>
</body>
</html>
